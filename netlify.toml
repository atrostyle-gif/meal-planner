# Next.js Runtime（@netlify/plugin-nextjs / OpenNext）
# 注意: publish = ".next" は「静的エクスポート」ではなく Runtime が要求する設定。
# 空の publish / 誤った dir 指定だと Functions が生成されず 404 になる。

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
