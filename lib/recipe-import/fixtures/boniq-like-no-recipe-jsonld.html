<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>低温調理のサンプルレシピ | Example</title>
    <meta property="og:title" content="低温調理のサンプルレシピ" />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"Example Site"}

  <body>
    <nav>メニュー</nav>
    <main>
      <h1>鶏むね肉のやわらか低温調理</h1>
      <p>☆4人分☆</p>
      <h2>BONIQする材料</h2>
      <ul>
        <li>・豚ばら肉500g</li>
        <li>・サニーレタス（または、サンチュ）20枚</li>
      </ul>
      <h2>BONIQ後、袋に入れる調味料</h2>
      <ul>
        <li>・塩</li>
        <li>・砂糖</li>
      </ul>
      <h2>作り方</h2>
      <div class="step">
        <h3>STEP1</h3>
        <img src="/a.jpg" alt="工程写真1" />
        <p>豚肉に塩を振る。</p>
      </div>
      <div class="step">
        <h3>STEP2</h3>
        <img src="/b.jpg" alt="工程写真2" />
        <p>袋に調味料と入れて低温調理する。</p>
      </div>
      <div class="step">
        <h3>STEP3</h3>
        <p>取り出してレタスと盛る。</p>
      </div>
      <h2>おすすめレシピ</h2>
      <ul>
        <li>別の人気レシピA</li>
        <li>別の人気レシピB</li>
      </ul>
      <h2>関連記事</h2>
      <p>関連の読み物タイトル</p>
      <div class="share">シェアする ツイート</div>
    </main>
    <footer>フッター</footer>
    <aside>広告サイド</aside>
  </body>
